<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-header bg-success text-white">
        <h4>{{ isEditMode ? 'Edit Destination' : 'Add New Destination' }}</h4>
      </div>
      <div class="card-body">
        <form [formGroup]="destinationForm" (ngSubmit)="onSubmit()">
          
          <div class="mb-3">
            <label class="form-label">City / Name</label>
            <input type="text" class="form-control" formControlName="name" placeholder="e.g., Tokyo">
          </div>

          <div class="mb-3">
            <label class="form-label">Country</label>
            <input type="text" class="form-control" formControlName="country" placeholder="e.g., Japan">
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" rows="3" formControlName="description"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Image URL (Optional)</label>
            <input type="text" class="form-control" formControlName="imageUrl" placeholder="https://...">
          </div>

          <div class="d-flex justify-content-between">
            <button type="button" class="btn btn-secondary" routerLink="/destinations">Cancel</button>
            <button type="submit" class="btn btn-success" [disabled]="destinationForm.invalid">
              {{ isEditMode ? 'Update' : 'Save' }} Destination
            </button>
          </div>
          
        </form>
      </div>
    </div>
  </div>
</div>
