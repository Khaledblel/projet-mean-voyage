<div class="row mb-3 align-items-center">
  <div class="col">
    <h2>Manage Destinations</h2>
  </div>
  <div class="col text-end">
    <button class="btn btn-success" routerLink="/destinations/new">+ Add Destination</button>
  </div>
</div>

<div class="card shadow-sm">
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Country</th>
          <th>Description</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let dest of destinations">
          <td class="align-middle fw-bold">{{ dest.name }}</td>
          <td class="align-middle">{{ dest.country }}</td>
          <td class="align-middle text-truncate" style="max-width: 250px;">{{ dest.description }}</td>
          <td class="align-middle text-end">
            <button class="btn btn-sm btn-outline-primary me-2" [routerLink]="['/destinations/edit', dest._id]">Edit</button>
            <button class="btn btn-sm btn-danger" (click)="deleteDestination(dest._id)">Delete</button>
          </td>
        </tr>
        <tr *ngIf="destinations.length === 0">
          <td colspan="4" class="text-center py-4">No destinations found.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
