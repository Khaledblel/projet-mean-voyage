<div class="form-page">
  <section class="page-hero page-hero-compact">
    <div class="row align-items-center gy-3">
      <div class="col-lg-8">
        <p class="eyebrow mb-2">Trips</p>
        <h2 class="hero-title mb-2">{{ isEditMode ? 'Edit Trip' : 'Create a New Trip' }}</h2>
        <p class="hero-subtitle mb-0">
          Capture the essentials: destination, price, duration, and start date.
        </p>
      </div>
      <div class="col-lg-4 text-lg-end">
        <button class="btn btn-ghost" routerLink="/trips">Back to trips</button>
      </div>
    </div>
  </section>

  <div class="card form-card">
    <div class="card-body">
      <form [formGroup]="tripForm" (ngSubmit)="onSubmit()">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">Trip title</label>
            <input type="text" class="form-control" formControlName="title" placeholder="Coastal escape">
          </div>

          <div class="col-12">
            <label class="form-label">Destination</label>
            <select class="form-select" formControlName="destination">
              <option value="" disabled>Select a destination</option>
              <option *ngFor="let dest of destinations" [value]="dest._id">
                {{ dest.name }}, {{ dest.country }}
              </option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">Price (USD)</label>
            <input type="number" class="form-control" formControlName="price" placeholder="1200">
          </div>
          <div class="col-md-4">
            <label class="form-label">Duration (Days)</label>
            <input type="number" class="form-control" formControlName="durationInDays" placeholder="5">
          </div>
          <div class="col-md-4">
            <label class="form-label">Start Date</label>
            <input type="date" class="form-control" formControlName="startDate">
          </div>

          <div class="col-12">
            <label class="form-label">Description</label>
            <textarea
              class="form-control"
              rows="4"
              formControlName="description"
              placeholder="Describe the trip vibe and highlights."></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-ghost" routerLink="/trips">Cancel</button>
          <button type="submit" class="btn btn-brand" [disabled]="tripForm.invalid">
            {{ isEditMode ? 'Update' : 'Save' }} Trip
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
