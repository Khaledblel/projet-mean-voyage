<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm mt-3">
      <div class="card-header bg-primary text-white">
        <h4>{{ isEditMode ? 'Edit Trip' : 'Add New Trip' }}</h4>
      </div>
      <div class="card-body">
        <form [formGroup]="tripForm" (ngSubmit)="onSubmit()">
          
          <div class="mb-3">
            <label class="form-label">Trip Title</label>
            <input type="text" class="form-control" formControlName="title">
          </div>

          <div class="mb-3">
            <label class="form-label">Destination</label>
            <select class="form-select" formControlName="destination">
              <option value="" disabled>Select a destination</option>
              <option *ngFor="let dest of destinations" [value]="dest._id">
                {{ dest.name }}, {{ dest.country }}
              </option>
            </select>
          </div>

          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label">Price ($)</label>
              <input type="number" class="form-control" formControlName="price">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Duration (Days)</label>
              <input type="number" class="form-control" formControlName="durationInDays">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Start Date</label>
              <input type="date" class="form-control" formControlName="startDate">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" rows="3" formControlName="description"></textarea>
          </div>

          <div class="d-flex justify-content-between">
            <button type="button" class="btn btn-secondary" routerLink="/trips">Cancel</button>
            <button type="submit" class="btn btn-success" [disabled]="tripForm.invalid">
              {{ isEditMode ? 'Update' : 'Save' }} Trip
            </button>
          </div>
          
        </form>
      </div>
    </div>
  </div>
</div>
